# Unitree Z1 from MuJoCo Menagerie (downloaded on first use).
# Tool axis: the last joint's axis, pointing away from the wrist. Planning margin covers the tracking error
# measured with the model's own servos under gravity.
name = "z1"

[model]
mjcf = "menagerie:z1"
floor_geom = "floor"
keyframe = "home"

[arm]
joints = ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6"]
tcp_body = "link06"
tool_axis = "x"
actuators = ["motor1", "motor2", "motor3", "motor4", "motor5", "motor6"]

[limits]
min_clearance_mm = 20
planning_margin_mm = 40

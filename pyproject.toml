[project]
name = "mjguard"
version = "0.2.0"
description = "Let LLM agents drive any MuJoCo-modelled robot arm over MCP, with every motion checked in the model before it runs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sam Ko" }]
requires-python = ">=3.11"
keywords = ["mcp", "robotics", "mujoco", "llm", "agents", "safety", "robot-arm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=1.30,<2", "mujoco>=3.2", "numpy>=1.26", "pydantic>=2.7", "robot_descriptions>=1.15"]

[project.optional-dependencies]
menagerie = []  # kept for compatibility; Menagerie support is now included

[project.scripts]
mjguard = "mjguard.cli:main"

[project.urls]
Repository = "https://github.com/SamKo88927/mjguard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
demo = ["imageio>=2.34", "pillow>=10"]
dev = ["hypothesis>=6.100", "pyright>=1.1.380", "pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=7", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["menagerie: needs robot_descriptions and a network download of MuJoCo Menagerie"]

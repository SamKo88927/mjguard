name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra menagerie
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check (pyright strict)
        run: uv run pyright
      - name: Tests, including UR5e and Panda from MuJoCo Menagerie
        run: uv run pytest -q --cov=mjguard --cov-report=term-missing --cov-fail-under=90
      - name: Build
        run: uv build

# Universal Robots UR5e from MuJoCo Menagerie. Needs: pip install 'mjguard[menagerie]'
name = "ur5e"

[model]
mjcf = "menagerie:ur5e"
floor_geom = "floor"
keyframe = "home"

[arm]
joints = ["shoulder_pan_joint", "shoulder_lift_joint", "elbow_joint", "wrist_1_joint", "wrist_2_joint", "wrist_3_joint"]
tcp_site = "attachment_site"
tool_axis = "z"
actuators = ["shoulder_pan", "shoulder_lift", "elbow", "wrist_1", "wrist_2", "wrist_3"]

[limits]
min_clearance_mm = 30
max_joint_speed_dps = 45

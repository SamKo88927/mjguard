# Unitree Z1 from MuJoCo Menagerie (downloaded on first use).
# Tool axis: the last joint's axis, pointing away from the wrist. Planning margin covers the tracking error
# measured with the model's own servos under gravity.
name = "z1"

[model]
mjcf = "menagerie:z1"
floor_geom = "floor"
keyframe = "home"

[arm]
joints = ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6"]
tcp_body = "link06"
tool_axis = "x"
# No actuators: simulated kinematically. Menagerie's Z1 position servos (30-60 N·m) cannot lift the arm
# back from low poses against gravity, and the real Z1's own torque controller is not modelled.

[limits]
min_clearance_mm = 20
planning_margin_mm = 10
